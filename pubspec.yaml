name: flutter_brainflow
description: >-
  Flutter/Dart bindings for BrainFlow, a library to acquire, parse and analyze
  EEG, EMG, ECG and other biosensor data.
version: 0.0.1
publish_to: none # remove once ready for pub.dev (M6)

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  # Used by hook/build.dart (hook dependencies must be regular dependencies).
  archive: ^4.0.0
  code_assets: ^2.1.0
  crypto: ^3.0.0
  hooks: ^2.0.0
  # Runtime
  ffi: ^2.1.0

dev_dependencies:
  ffigen: ^23.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      # Android needs a Gradle module for SimpleBLE's Java bridge classes and
      # its preload shim (pluginClass). Native libraries themselves are
      # delivered by hook/build.dart on every platform.
      android:
        ffiPlugin: true
        package: org.brainflow.flutter_brainflow
        pluginClass: FlutterBrainflowPlugin
