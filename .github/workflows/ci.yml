name: CI
on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # BrainFlow release archives downloaded by hook/build.dart
      - uses: actions/cache@v4
        with:
          path: ~/.cache/flutter_brainflow
          key: brainflow-${{ hashFiles('hook/brainflow_release.dart') }}
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test hook tool example/lib example/test
      - run: flutter analyze
      - run: flutter test
      - run: flutter test
        working-directory: example
