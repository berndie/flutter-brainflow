include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - spike/**
    - lib/src/ffi/bindings.g.dart
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - prefer_single_quotes
    - public_member_api_docs
    - unawaited_futures
